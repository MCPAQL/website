name: Website Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: |
            README.md
            CLA.md
            CONTRIBUTING.md
            NOTICE.md
            TRADEMARKS.md
            COMMERCIAL-LICENSE.md
            docs/prelaunch-readiness-review.md

  html-lint:
    name: HTML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install htmlhint
        run: npm install --global htmlhint@1.6.3

      - name: Lint HTML
        run: htmlhint --config .htmlhintrc "public/**/*.html"

  links:
    name: Link Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --no-progress --verbose "README.md" "docs/prelaunch-readiness-review.md" "public/**/*.html"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
